config_version = 20

[bar.default]
background_opacity = 0.0
capsule = true
capsule_border = "secondary_container"
capsule_fill = "on_tertiary"
capsule_radius = 8
center = [ "workspaces" ]
margin_ends = 0
radius = 0
start = [ "launcher", "clock" ]

[control_center]
hidden_tabs = [ "power", "network", "bluetooth" ]

    [[control_center.shortcuts]]
    type = "notification"

    [[control_center.shortcuts]]
    type = "keyboard_layout"

    [[control_center.shortcuts]]
    type = "audio"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "caffeine"

    [[control_center.shortcuts]]
    type = "nightlight"

[location]
address = "Viña del Mar"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "DP-3"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 640.0
    cy = 842.0
    output = "HDMI-A-1"
    placement_height = 1024.0
    placement_width = 1280.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell.launcher]
layout = "simple"
pinned = [ "helium", "steam", "discord" ]
search_position = "top"

[shell.panel]
control_center_placement = "floating"
launcher_placement = "attached"

[theme]
builtin = "Tokyo-Night"
community_palette = "Atuel"
custom_palette = "Poimandres"
mode = "dark"
source = "custom"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "kitty" ]

[wallpaper]
directory = "/home/Terrapin/Pictures/Wallpapers"
fill_color = "on_primary"

    [wallpaper.default]
    path = "/home/Terrapin/Pictures/Wallpapers/wallpaper.png"

    [wallpaper.last]
    path = "/home/Terrapin/Pictures/Wallpapers/wallpaper.png"

    [wallpaper.monitors.DP-3]
    path = "/home/Terrapin/Pictures/Wallpapers/wallpaper.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/Terrapin/Pictures/Wallpapers/wallpaper.png"

[widget.active_window]
anchor = true
max_length = 200
min_length = 20
title_scroll = "on_hover"

[widget.clock]
format = "{:%H:%M - %d/%m/%Y}"

[widget.control-center]
enabled = false

[widget.media]
capsule_border = "secondary"
max_length = 120
scroll_repeat = "gesture"
show_progress = true
title_scroll = "on_hover"

[widget.network]
show_label = false

[widget.spacer_3]
type = "spacer"

[widget.spacer_4]
type = "spacer"

[widget.spacer_5]
type = "spacer"

[widget.workspaces]
active_pill_size = 2.0
capsule_border = "primary"
labels_only_when_occupied = true
pill_scale = 0.5
separator = "•"
separator_color = "on_secondary_container"
show_labels = false